name: E2E branch bootstrap
on:
  push:
    branches: [agent/tester-army-e2e]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/tester-army-e2e
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - name: Commit generated lockfile
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add bun.lock
            git commit -m 'chore: update bun lock for e2e [skip ci]'
            git push origin HEAD:agent/tester-army-e2e
          fi
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run local:setup
      - run: bunx --no-install playwright install --with-deps chromium
      - run: bun run test:e2e
